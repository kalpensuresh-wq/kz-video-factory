name: Render Video

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install

      - name: Synthesize Noir SFX & Generate Gemini Male Voiceover
        env:
          CONFIG_JSON: ${{ github.event.client_payload.config_json }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public/sfx out
          python3 - << 'EOF'
          import os, sys, json, time, math, wave, struct, random, base64
          import urllib.request, urllib.error

          # =====================================================================
          # 1. CINEMATIC NOIR SFX & BGM SYNTHESIZER (v8.2)
          # =====================================================================
          SR = 44100

          def write_wav(path, samples, sample_rate=SR):
              with wave.open(path, 'w') as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(sample_rate)
                  buf = bytearray()
                  for s in samples:
                      val = max(-1.0, min(1.0, s))
                      buf.extend(struct.pack('<h', int(val * 32767)))
                  wf.writeframes(buf)

          def ensure_sfx():
              rng = random.Random(88)
              resolved = {}

              def find_custom(name):
                  for ext in ('mp3', 'wav'):
                      p = f'public/sfx/{name}.{ext}'
                      if os.path.exists(p) and os.path.getsize(p) > 500:
                          return f'sfx/{name}.{ext}'
                  return None

              # boom.wav
              resolved['boom'] = find_custom('boom') or 'sfx/boom.wav'
              if not find_custom('boom'):
                  n = int(SR * 0.85)
                  samples = [
                      0.85 * math.exp(-(i/SR)*3.8) * min(1.0, (i/SR)/0.008)
                      * math.sin(2*math.pi*(36.0 + 95.0*math.exp(-(i/SR)*14.0))*(i/SR))
                      for i in range(n)
                  ]
                  write_wav('public/sfx/boom.wav', samples)

              # sms.wav
              resolved['sms'] = find_custom('sms') or 'sfx/sms.wav'
              if not find_custom('sms'):
                  n = int(SR * 0.38)
                  samples = []
                  for i in range(n):
                      t = i / SR
                      s = 0.0
                      if t < 0.14:
                          s += 0.55 * math.exp(-t*18.0) * min(1.0, t/0.004) * math.sin(2*math.pi*880.0*t)
                      if t >= 0.10:
                          t2 = t - 0.10
                          s += 0.65 * math.exp(-t2*12.0) * min(1.0, t2/0.004) * math.sin(2*math.pi*1174.66*t2)
                      samples.append(s)
                  write_wav('public/sfx/sms.wav', samples)

              # heartbeat.wav
              resolved['heartbeat'] = find_custom('heartbeat') or 'sfx/heartbeat.wav'
              if not find_custom('heartbeat'):
                  n = int(SR * 0.75)
                  samples = [0.0] * n
                  for start_t, amp in [(0.0, 0.85), (0.24, 0.65)]:
                      si = int(start_t * SR)
                      for i in range(si, min(n, si + int(0.22 * SR))):
                          t = (i - si) / SR
                          samples[i] += amp * math.exp(-t*16.0) * min(1.0, t/0.01) * math.sin(2*math.pi*(44.0 + 36.0*math.exp(-t*22.0))*t)
                  write_wav('public/sfx/heartbeat.wav', samples)

              # whoosh.wav
              resolved['whoosh'] = find_custom('whoosh') or 'sfx/whoosh.wav'
              if not find_custom('whoosh'):
                  n = int(SR * 0.32)
                  samples, prev = [], 0.0
                  for i in range(n):
                      u = i / n
                      env = math.sin(math.pi * u) ** 1.6
                      prev = prev + (0.04 + 0.24*math.sin(math.pi*u)) * (rng.uniform(-1.0, 1.0) - prev)
                      samples.append(0.7 * env * prev)
                  write_wav('public/sfx/whoosh.wav', samples)

              # pop.wav
              resolved['pop'] = find_custom('pop') or 'sfx/pop.wav'
              if not find_custom('pop'):
                  n = int(SR * 0.14)
                  samples = [
                      0.75 * math.exp(-(i/SR)*28.0) * min(1.0, (i/SR)/0.005)
                      * math.sin(2*math.pi*(320.0 + 580.0*(1.0 - math.exp(-(i/SR)*35.0)))*(i/SR))
                      for i in range(n)
                  ]
                  write_wav('public/sfx/pop.wav', samples)

              # bgm.wav (8-sec moody night pulse)
              resolved['bgm'] = find_custom('bgm') or 'sfx/bgm.wav'
              if not find_custom('bgm'):
                  n = int(SR * 8.0)
                  samples = [0.0] * n
                  chords = [[110.0, 130.81, 164.81, 246.94], [87.31, 110.0, 130.81, 196.0], [98.0, 123.47, 146.83, 220.0], [82.41, 98.0, 123.47, 164.81]]
                  beat_sec = 60.0 / 82.0
                  for i in range(n):
                      t = i / SR
                      c_idx = int(t / 2.0) % len(chords)
                      pad = sum(math.sin(2*math.pi*f*t) for f in chords[c_idx]) * 0.075 * (0.55 + 0.45*math.sin(math.pi*((t % 2.0)/2.0)))
                      b_pos = (t / beat_sec) % 1.0
                      tick = 0.09 * math.exp(-(b_pos*beat_sec)*140.0) * math.sin(2*math.pi*1650.0*(b_pos*beat_sec)) if b_pos < 0.018 else 0.0
                      bar_pos = (t / beat_sec) % 4.0
                      pulse = 0.24 * math.exp(-(bar_pos*beat_sec)*10.0) * math.sin(2*math.pi*55.0*(bar_pos*beat_sec)) if bar_pos < 0.25 else 0.0
                      samples[i] = pad + tick + pulse
                  write_wav('public/sfx/bgm.wav', samples)

              return resolved

          sfx_files = ensure_sfx()

          # =====================================================================
          # 2. GEMINI TTS (STRICT STUDIO MALE VOICE — ABORTS ON FAILURE)
          # =====================================================================
          api_key = (os.environ.get('GEMINI_API_KEY') or '').strip()
          if not api_key:
              print('FATAL ERROR: GEMINI_API_KEY secret is missing or empty.')
              sys.exit(1)

          STYLE_DIRECTIONS = {
              'danger': 'Прочитай естественно, напряжённым и слегка усталым мужским голосом, как ночная исповедь в 3 часа ночи. Темп живой, без лишних пауз:',
              'tension': 'Прочитай тихим, сосредоточенным и тревожным мужским голосом, с ощущением нервного напряжения. Темп живой:',
              'comeback': 'Прочитай спокойным, интригующим мужским голосом, как будто делишься секретом. Темп уверенный:',
              'neutral': 'Прочитай живым, естественным разговорным мужским голосом, как честный рассказ другу ночью. Темп чуть выше среднего:',
          }

          TTS_MODELS = [
              'gemini-2.5-flash-preview-tts',
              'gemini-2.5-flash-tts',
          ]

          def gemini_tts(text, idx, tone='neutral', voice_name='Fenrir'):
              wav_name = f'beat_{idx}.wav'
              wav_path = f'public/{wav_name}'
              direction = STYLE_DIRECTIONS.get(tone, STYLE_DIRECTIONS['neutral'])
              prompt_text = f'{direction} "{text}"'

              payload = json.dumps({
                  'contents': [{'parts': [{'text': prompt_text}]}],
                  'generationConfig': {
                      'responseModalities': ['AUDIO'],
                      'speechConfig': {
                          'voiceConfig': {
                              'prebuiltVoiceConfig': {
                                  'voiceName': voice_name
                              }
                          }
                      }
                  }
              }).encode('utf-8')

              last_err = ''
              for model in TTS_MODELS:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}'
                  for attempt in range(4):
                      req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
                      try:
                          with urllib.request.urlopen(req, timeout=60) as resp:
                              data = json.loads(resp.read().decode('utf-8'))
                          parts = data.get('candidates', [{}])[0].get('content', {}).get('parts', [])
                          inline = next((p.get('inlineData') for p in parts if 'inlineData' in p), None)
                          if not inline or not inline.get('data'):
                              raise ValueError(f'No audio inlineData returned: {str(data)[:250]}')

                          pcm_bytes = base64.b64decode(inline['data'])
                          if len(pcm_bytes) < 2000:
                              raise ValueError(f'Audio too short ({len(pcm_bytes)} bytes)')

                          # Gemini TTS returns 24kHz 16-bit mono PCM (audio/L16)
                          with wave.open(wav_path, 'wb') as wf:
                              wf.setnchannels(1)
                              wf.setsampwidth(2)
                              wf.setframerate(24000)
                              wf.writeframes(pcm_bytes)

                          dur_sec = len(pcm_bytes) / float(2 * 24000)
                          print(f'Beat {idx} OK via {model} ({voice_name}): {dur_sec:.2f}s')
                          return wav_name, dur_sec

                      except urllib.error.HTTPError as e:
                          body = e.read().decode('utf-8', errors='ignore')
                          last_err = f'{model} HTTP {e.code}: {body[:300]}'
                          print(f'Attempt {attempt+1}/4 failed -> {last_err}')
                          if e.code == 404:
                              break
                          if e.code == 429:
                              wait_s = 6 * (attempt + 1)
                              print(f'Rate limited (429), sleeping {wait_s}s...')
                              time.sleep(wait_s)
                          else:
                              time.sleep(3)
                      except Exception as e:
                          last_err = f'{model} error: {e}'
                          print(f'Attempt {attempt+1}/4 failed -> {last_err}')
                          time.sleep(3)

              print(f'FATAL ERROR: Gemini TTS failed for beat {idx}. Aborting render so no bad video is sent. Last error: {last_err}')
              sys.exit(1)

          cfg_raw = os.environ.get('CONFIG_JSON') or '{}'
          cfg = json.loads(cfg_raw) if cfg_raw.strip() else {}
          beats = cfg.get('beats') or []

          if not beats:
              print('FATAL ERROR: No beats found in CONFIG_JSON.')
              sys.exit(1)

          voice_name = cfg.get('voiceName') or 'Fenrir'
          FPS = 30
          GAP_FRAMES = 4
          cursor = 0

          for idx, beat in enumerate(beats):
              fname, dur_sec = gemini_tts(beat.get('ru', ''), idx, tone=beat.get('tone', 'neutral'), voice_name=voice_name)
              dur_frames = max(36, int(math.ceil(dur_sec * FPS)) + GAP_FRAMES)
              beat['audioFile'] = fname
              beat['fromFrame'] = cursor
              beat['durationInFrames'] = dur_frames
              cursor += dur_frames
              if idx < len(beats) - 1:
                  time.sleep(2.0)

          total_frames = max(150, cursor + 12)

          with open('props.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'config': cfg,
                  'durationInFrames': total_frames,
                  'sfxFiles': sfx_files
              }, f, ensure_ascii=False)
          EOF

      - name: Render MP4 with Remotion
        run: npx remotion render src/index.ts MainVideo out/video.mp4 --props=./props.json

      - name: Send MP4 to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -F "chat_id=${TG_CHAT_ID}" \
               -F "video=@out/video.mp4" \
               -F "caption=🎬 Дневник лудомана (Master Engine v8.2 • Gemini AI Голос + Нуар + Живой экран)" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendVideo"
