name: Render Video

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          pip install --upgrade edge-tts mutagen gTTS

      - name: Generate Voice & Props
        env:
          VOICE_RU: ${{ github.event.client_payload.voice_ru }}
          SUBS_KZ: ${{ github.event.client_payload.subs_kz }}
          CONFIG_JSON: ${{ github.event.client_payload.config_json }}
        run: |
          mkdir -p public out
          python3 - << 'EOF'
          import os, json, time, asyncio, edge_tts
          from mutagen.mp3 import MP3
          from gtts import gTTS

          voice = os.environ.get('VOICE_RU') or 'Думаешь, если у слота отдача девяносто шесть процентов, то со ста тысяч тенге ты гарантированно вернёшь девяносто шесть? Это главная ловушка. Всё для уверенного старта оставили в профиле.'
          subs = os.environ.get('SUBS_KZ') or 'Слоттың RTP-і 96% болса, 100 000 теңгеден 96 000 қайтады деп ойлайсың ба? Бастауға керектің бәрі профильде.'
          cfg_raw = os.environ.get('CONFIG_JSON') or json.dumps({
              'id': 3,
              'sticker': {'code': '1w_91444', 'label': '+500% на 4 старта', 'showAtSec': 3.5},
              'scenes': []
          })
          cfg = json.loads(cfg_raw)

          # 1. Генерируем озвучку: 3 попытки через edge-tts, при сбое — резервный gTTS
          tts_ok = False
          for attempt in range(3):
              try:
                  asyncio.run(edge_tts.Communicate(voice, 'ru-RU-DmitryNeural').save('public/voice.mp3'))
                  if os.path.exists('public/voice.mp3') and os.path.getsize('public/voice.mp3') > 1000:
                      tts_ok = True
                      break
              except Exception as e:
                  print(f'edge-tts attempt {attempt + 1} failed:', e)
                  time.sleep(2)

          if not tts_ok:
              print('Using gTTS fallback...')
              gTTS(text=voice, lang='ru').save('public/voice.mp3')

          # 2. Замеряем точную длину озвучки
          dur_sec = MP3('public/voice.mp3').info.length
          duration_frames = max(150, int((dur_sec + 0.6) * 30))

          with open('props.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'config': cfg,
                  'subsKz': subs,
                  'hasAudio': True,
                  'durationInFrames': duration_frames
              }, f, ensure_ascii=False)
          EOF

      - name: Render MP4 with Remotion
        run: npx remotion render src/index.ts MainVideo out/video.mp4 --props=./props.json

      - name: Send MP4 to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -F "chat_id=${TG_CHAT_ID}" \
               -F "video=@out/video.mp4" \
               -F "caption=🎬 Ролик v3.0 готов! (Чистый вектор)" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendVideo"
               
